name: Build FUTO Korean Hardware v4

on:
  push:
    branches:
      - build/futo-korean-hardware-v4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout builder files
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout FUTO Keyboard 0.1.30
        uses: actions/checkout@v4
        with:
          repository: futo-org/android-keyboard
          ref: 0.1.30
          path: futo
          fetch-depth: 1
          submodules: recursive
          lfs: true

      - name: Pull submodule LFS objects
        shell: bash
        run: |
          set -euxo pipefail
          git lfs install
          git -C futo submodule foreach --recursive 'git lfs pull || true'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: futo/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.22.1'

      - name: Apply physical Korean keyboard implementation
        shell: bash
        run: |
          set -euxo pipefail
          cp builder/futo-v4/HardwareKoreanInputController.kt \
            futo/java/src/org/futo/inputmethod/latin/HardwareKoreanInputController.kt
          python3 builder/futo-v4/patch_latinime.py futo
          git -C futo diff --check
          mkdir -p out/source
          cp builder/futo-v4/HardwareKoreanInputController.kt out/source/
          cp builder/futo-v4/patch_latinime.py out/source/
          git -C futo diff --no-ext-diff > out/source/futo-korean-hardware-v4.patch
          grep -n 'hardwareKoreanInput' futo/java/src/org/futo/inputmethod/latin/LatinIME.kt

      - name: Build unstable debug APK
        shell: bash
        env:
          VERSION_CODE: '130020'
          VERSION_NAME: '0.1.30-korean-hardware-v4'
          BRANCH_NAME: 'korean-hardware-v4'
        run: |
          set -euxo pipefail
          chmod +x futo/gradlew
          (
            cd futo
            ./gradlew --no-daemon --stacktrace assembleUnstableDebug
          ) 2>&1 | tee out/build.log

      - name: Package and verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find futo/build/outputs/apk -type f -name '*unstable*debug*.apk' -print -quit)"
          test -n "$APK"
          OUT_APK='out/FUTO-Keyboard-0.1.30-Korean-Hardware-v4.apk'
          cp "$APK" "$OUT_APK"
          unzip -t "$OUT_APK" > out/zip-integrity.txt
          sha256sum "$OUT_APK" > out/FUTO-Keyboard-0.1.30-Korean-Hardware-v4.apk.sha256

          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$OUT_APK" > out/FUTO-Keyboard-0.1.30-Korean-Hardware-v4.apksigner.txt
          "$AAPT" dump badging "$OUT_APK" > out/FUTO-Keyboard-0.1.30-Korean-Hardware-v4.badging.txt

          {
            echo 'FUTO Keyboard 0.1.30 Korean Hardware v4'
            echo
            echo "APK: $(basename "$OUT_APK")"
            echo "Size: $(stat -c%s "$OUT_APK") bytes"
            echo "SHA-256: $(sha256sum "$OUT_APK" | awk '{print $1}')"
            echo
            echo 'Implementation:'
            echo '- Independent physical-keyboard Korean/English mode'
            echo '- Ctrl+Space, KEYCODE_LANGUAGE_SWITCH, or Linux scan code 122 toggles mode'
            echo '- Physical QWERTY keys map to Dubeolsik jamo'
            echo '- Non-composing commit/replace Hangul assembly (no composing span)'
            echo '- Backspace decomposes the locally assembled jamo sequence'
            echo '- Ctrl/Alt/Meta shortcuts pass through to the target application'
            echo
            echo 'Build:'
            echo '- Base source: futo-org/android-keyboard tag 0.1.30'
            echo '- Variant: unstableDebug'
            echo '- Package expected: org.futo.inputmethod.latin.unstable'
            echo '- Version code: 130020'
            echo '- Version name: 0.1.30-korean-hardware-v4-unstable'
          } > out/FUTO-Keyboard-0.1.30-Korean-Hardware-v4-verification.txt

          cat out/FUTO-Keyboard-0.1.30-Korean-Hardware-v4.apksigner.txt
          head -n 5 out/FUTO-Keyboard-0.1.30-Korean-Hardware-v4.badging.txt
          cat out/FUTO-Keyboard-0.1.30-Korean-Hardware-v4-verification.txt

      - name: Upload APK and verification files
        uses: actions/upload-artifact@v4
        with:
          name: futo-korean-hardware-v4
          path: out/
          if-no-files-found: error
          retention-days: 7
