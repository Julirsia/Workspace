name: Build FUTO System Subtypes APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4
        with:
          path: harness

      - name: Checkout FUTO Keyboard 0.1.30
        uses: actions/checkout@v4
        with:
          repository: futo-org/android-keyboard
          ref: 0.1.30
          submodules: recursive
          path: futo

      - name: Fetch Git LFS assets
        working-directory: futo
        shell: bash
        run: |
          git lfs install
          git submodule foreach --recursive 'git lfs pull || true'

      - name: Patch Android system IME subtypes
        shell: bash
        run: python3 harness/.github/scripts/futo_system_subtypes_patch.py

      - name: Verify subtype patch
        shell: bash
        run: |
          echo '===== method.xml ====='
          cat futo/java/res/xml/method.xml
          echo '===== bridge ====='
          grep -n -A100 -B5 'configuredSubtypeForLanguage' futo/java/src/org/futo/inputmethod/latin/LatinIME.kt
          echo '===== subtype label ====='
          grep -n 'futo_system_subtype_label' futo/java/res/values/strings-appname.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build patched unstable debug APK
        working-directory: futo
        shell: bash
        env:
          VERSION_CODE: '130002'
          VERSION_NAME: '0.1.30-system-subtypes'
          BRANCH_NAME: 'system-subtypes-patch'
        run: |
          chmod +x gradlew
          ./gradlew assembleUnstableDebug --no-daemon --stacktrace

      - name: Show APKs
        if: always()
        shell: bash
        run: find futo -path '*/build/outputs/apk/*' -type f -name '*.apk' -print || true

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: futo-0.1.30-system-subtypes
          path: futo/build/outputs/apk/unstable/debug/*.apk
          if-no-files-found: error
          retention-days: 3
