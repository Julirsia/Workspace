name: Build FUTO English-Korean System Subtypes APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4
        with:
          path: harness

      - name: Checkout FUTO Keyboard 0.1.30
        uses: actions/checkout@v4
        with:
          repository: futo-org/android-keyboard
          ref: 0.1.30
          submodules: recursive
          path: futo

      - name: Fetch Git LFS assets
        working-directory: futo
        shell: bash
        run: |
          git lfs install
          git submodule foreach --recursive 'git lfs pull || true'

      - name: Patch and validate Android IME subtypes
        shell: bash
        run: |
          python3 -m py_compile harness/.github/scripts/futo_system_subtypes_patch.py
          python3 harness/.github/scripts/futo_system_subtypes_patch.py

          echo '===== method.xml ====='
          cat futo/java/res/xml/method.xml
          echo '===== LatinIME bridge placement ====='
          python3 - <<'PY'
          from pathlib import Path

          text = Path("futo/java/src/org/futo/inputmethod/latin/LatinIME.kt").read_text()
          latin = text.index("class LatinIME : InputMethodServiceCompose()")
          bridge = text.index("private var systemSubtypeBridgeReady = false")
          assert bridge > latin
          assert text.count("override fun onCurrentInputMethodSubtypeChanged") == 1
          assert text.count("enableEnglishAndKoreanSystemSubtypes()") == 3  # declaration + onCreate + unlock
          assert "syncSystemSubtypeFromFutoSubtype(subtype)" in text
          print(text[bridge - 160:bridge + 1200])
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build patched unstable debug APK
        working-directory: futo
        shell: bash
        env:
          VERSION_CODE: '130010'
          VERSION_NAME: '0.1.30-system-subtypes-v2'
          BRANCH_NAME: 'system-subtypes-v2'
        run: |
          chmod +x gradlew
          ./gradlew assembleUnstableDebug --no-daemon --stacktrace

      - name: Verify compiled APK contains two visible subtypes
        working-directory: futo
        shell: bash
        run: |
          APK="$(find build/outputs/apk/unstable/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"

          "$AAPT2" dump xmltree "$APK" --file res/xml/method.xml | tee /tmp/method-xmltree.txt
          test "$(grep -c 'E: subtype' /tmp/method-xmltree.txt)" -eq 2
          grep -q 'imeSubtypeLocale.*en_US' /tmp/method-xmltree.txt
          grep -q 'imeSubtypeLocale.*ko_KR' /tmp/method-xmltree.txt
          test "$(grep -c 'subtypeId' /tmp/method-xmltree.txt)" -eq 2
          ! grep -q 'overridesImplicitlyEnabledSubtype' /tmp/method-xmltree.txt

          sha256sum "$APK" | tee "$APK.sha256"
          ls -lh "$APK" "$APK.sha256"

      - name: Show APKs
        if: always()
        shell: bash
        run: find futo -path '*/build/outputs/apk/*' -type f -print || true

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: futo-0.1.30-system-subtypes-v2
          path: |
            futo/build/outputs/apk/unstable/debug/*.apk
            futo/build/outputs/apk/unstable/debug/*.sha256
          if-no-files-found: error
          retention-days: 3
